[package]
name = "zebgen-monero-wasm"
version = "0.5.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
monero-wallet = "=0.2.0"
monero-daemon-rpc = "=0.2.0"
curve25519-dalek = { version = "4", default-features = false, features = [
  "alloc",
  "zeroize",
] }
zeroize = "1"
hex = { version = "0.4", features = ["std"] }
serde_json = "1"
rand_core = { version = "0.6", features = ["getrandom"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
# No `unsafe-eval`: zebgen's MV3 CSP forbids `new Function`/eval.
js-sys = { version = "0.3", default-features = false, features = ["std"] }
web-sys = { version = "0.3", features = [
  "AbortController",
  "AbortSignal",
  "Headers",
  "ReadableStream",
  "ReadableStreamDefaultReader",
  "Request",
  "RequestInit",
  "Response",
] }
send_wrapper = { version = "0.6", features = ["futures"] }
md-5 = "0.10"
base64 = "0.22"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Transitive via rand_core 0.6; needs the browser crypto.getRandomValues backend on wasm.
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
