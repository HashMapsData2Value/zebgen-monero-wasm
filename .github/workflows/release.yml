name: Release

# Push a tag matching Cargo.toml's version (e.g. v0.1.0) to build pkg/ from source
# and attach it to a GitHub Release as an npm tarball.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches Cargo.toml version
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          test "v$VERSION" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$VERSION"; exit 1; }

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.93.0'
          targets: wasm32-unknown-unknown

      - name: Read wasm-bindgen version from Cargo.lock
        id: bindgen
        run: echo "version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')" >> "$GITHUB_OUTPUT"

      # The CLI must match the wasm-bindgen crate version exactly.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.bindgen.outputs.version }}

      - run: cargo test --locked
      - run: ./scripts/build.sh

      - name: Pack
        id: pack
        working-directory: pkg
        run: |
          TARBALL=$(npm pack --silent)
          sha256sum "$TARBALL" | tee "$TARBALL.sha256"
          echo "tarball=pkg/$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.pack.outputs.tarball }}" "${{ steps.pack.outputs.tarball }}.sha256" --generate-notes
