name: Release

# semantic-release picks the next version from Conventional Commits on main, writes it into
# Cargo.toml, rebuilds pkg/ from source, publishes to npm via trusted publishing (OIDC, with
# provenance) and attaches the tarball to a GitHub Release. npm's trusted publisher is bound
# to this workflow's filename: keep it named release.yml.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      # Trusted publishing needs npm >= 11.5.1.
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: npm --version

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.93.0'
          targets: wasm32-unknown-unknown

      - name: Read wasm-bindgen version from Cargo.lock
        id: bindgen
        run: echo "version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')" >> "$GITHUB_OUTPUT"

      # The CLI must match the wasm-bindgen crate version exactly.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.bindgen.outputs.version }}

      - run: cargo test --locked
      # Builds pkg/ so semantic-release's npm plugin can verify it; rebuilt with the new version on release.
      - run: ./scripts/build.sh

      - name: Build isolated Monero test image
        run: docker build -t zebgen-monero-test -f tests/monero.Dockerfile .
      - name: Test funded cached transaction preparation
        run: node --test tests/fundedTransactionCheckpoint.cjs
        env:
          MONERO_TEST_IMAGE: zebgen-monero-test
      - run: npm ci
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
